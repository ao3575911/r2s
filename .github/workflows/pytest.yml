name: pytest
on:
  push:
    branches: [main, feat/**]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Schema parity (root vs packaged)
        run: python scripts/check_schema_parity.py
      - run: pytest -q
